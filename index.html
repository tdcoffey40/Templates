<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System</title>
  <link rel="stylesheet" href="styles/variables.css">
  <script>(function(){try{var t=localStorage.getItem('ds-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}}());</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; /* lint-ignore */
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }

    .logo-text {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-text);
      letter-spacing: var(--tracking-tight);
    }

    .logo-sub {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      font-weight: var(--font-normal);
    }

    /* Theme Toggle */
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-lg);
      background: var(--color-surface-overlay);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 150ms ease, border-color 150ms ease;
      color: var(--color-text-muted);
    }
    .theme-toggle:hover {
      background: var(--color-surface-raised);
      color: var(--color-text);
    }

    .icon-sun, .icon-moon { display: none; }
    [data-theme="light"] .icon-sun  { display: block; }
    [data-theme="dark"]  .icon-moon { display: block; }

    /* Navigation */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) var(--space-3);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }

    .nav-group {
      margin-bottom: var(--space-5);
    }

    .nav-group-title {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--color-text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 var(--space-3) var(--space-2);
      display: block;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-link:hover {
      background: var(--color-surface-overlay);
      color: var(--color-text);
    }
    .nav-link.active {
      background: var(--color-primary-subtle);
      color: var(--color-primary);
      font-weight: var(--font-medium);
    }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
      flex-shrink: 0;
    }
    .nav-link.active .nav-dot { opacity: 1; }

    /* ---- Main Area ---- */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-bg);
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      flex-shrink: 0;
      min-height: 52px;
    }

    .preview-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-text);
    }

    .preview-breadcrumb {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: 1px;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      background: transparent;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
      text-decoration: none;
    }
    .open-btn:hover {
      background: var(--color-surface-overlay);
      color: var(--color-text);
    }

    .preview-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ---- Welcome Screen ---- */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: var(--space-4);
      text-align: center;
      padding: var(--space-8);
      color: var(--color-text-muted);
    }
    .welcome-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary-subtle), var(--color-secondary-subtle));
      border-radius: var(--radius-2xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-2);
    }
    .welcome h2 {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      color: var(--color-text);
    }
    .welcome p {
      font-size: var(--text-sm);
      max-width: 320px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-mark"></div>
        <div>
          <div class="logo-text">Design System</div>
          <div class="logo-sub">v1.0</div>
        </div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
        <!-- Sun -->
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <!-- Moon -->
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Component navigation">

      <div class="nav-group">
        <span class="nav-group-title">Tools</span>
        <button class="nav-link" data-src="config.html" data-label="Theme Configurator" data-group="Tools">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;opacity:0.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Theme Configurator
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Foundation</span>
        <button class="nav-link" data-src="components/typography.html" data-label="Typography" data-group="Foundation">
          <span class="nav-dot"></span> Typography
        </button>
        <button class="nav-link" data-src="components/colors.html" data-label="Colors" data-group="Foundation">
          <span class="nav-dot"></span> Colors
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Inputs</span>
        <button class="nav-link" data-src="components/button.html" data-label="Button" data-group="Inputs">
          <span class="nav-dot"></span> Button
        </button>
        <button class="nav-link" data-src="components/input.html" data-label="Input" data-group="Inputs">
          <span class="nav-dot"></span> Input
        </button>
        <button class="nav-link" data-src="components/select.html" data-label="Select" data-group="Inputs">
          <span class="nav-dot"></span> Select
        </button>
        <button class="nav-link" data-src="components/checkbox.html" data-label="Checkbox" data-group="Inputs">
          <span class="nav-dot"></span> Checkbox
        </button>
        <button class="nav-link" data-src="components/radio.html" data-label="Radio" data-group="Inputs">
          <span class="nav-dot"></span> Radio
        </button>
        <button class="nav-link" data-src="components/switch.html" data-label="Switch" data-group="Inputs">
          <span class="nav-dot"></span> Switch
        </button>
        <button class="nav-link" data-src="components/slider.html" data-label="Slider" data-group="Inputs">
          <span class="nav-dot"></span> Slider
        </button>
        <button class="nav-link" data-src="components/datepicker.html" data-label="Datepicker" data-group="Inputs">
          <span class="nav-dot"></span> Datepicker
        </button>
        <button class="nav-link" data-src="components/calendar.html" data-label="Calendar" data-group="Inputs">
          <span class="nav-dot"></span> Calendar
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Content</span>
        <button class="nav-link" data-src="components/card.html" data-label="Card" data-group="Content">
          <span class="nav-dot"></span> Card
        </button>
        <button class="nav-link" data-src="components/badge.html" data-label="Badge" data-group="Content">
          <span class="nav-dot"></span> Badge
        </button>
        <button class="nav-link" data-src="components/avatar.html" data-label="Avatar" data-group="Content">
          <span class="nav-dot"></span> Avatar
        </button>
        <button class="nav-link" data-src="components/chip.html" data-label="Chip" data-group="Content">
          <span class="nav-dot"></span> Chip
        </button>
        <button class="nav-link" data-src="components/table.html" data-label="Table" data-group="Content">
          <span class="nav-dot"></span> Table
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Feedback</span>
        <button class="nav-link" data-src="components/alert.html" data-label="Alert" data-group="Feedback">
          <span class="nav-dot"></span> Alert
        </button>
        <button class="nav-link" data-src="components/progress.html" data-label="Progress" data-group="Feedback">
          <span class="nav-dot"></span> Progress
        </button>
        <button class="nav-link" data-src="components/tooltip.html" data-label="Tooltip" data-group="Feedback">
          <span class="nav-dot"></span> Tooltip
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Overlay</span>
        <button class="nav-link" data-src="components/dialog.html" data-label="Dialog" data-group="Overlay">
          <span class="nav-dot"></span> Dialog
        </button>
        <button class="nav-link" data-src="components/dropdown.html" data-label="Dropdown" data-group="Overlay">
          <span class="nav-dot"></span> Dropdown
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">Navigation</span>
        <button class="nav-link" data-src="components/accordion.html" data-label="Accordion" data-group="Navigation">
          <span class="nav-dot"></span> Accordion
        </button>
        <button class="nav-link" data-src="components/tabs.html" data-label="Tabs" data-group="Navigation">
          <span class="nav-dot"></span> Tabs
        </button>
        <button class="nav-link" data-src="components/navigation.html" data-label="Navigation" data-group="Navigation">
          <span class="nav-dot"></span> Navigation
        </button>
      </div>

    </nav>
  </aside>

  <!-- Main Preview Area -->
  <main class="main">
    <header class="preview-header">
      <div>
        <div class="preview-title" id="preview-title">Select a component</div>
        <div class="preview-breadcrumb" id="preview-breadcrumb"></div>
      </div>
      <div class="preview-actions">
        <a class="open-btn" id="open-link" href="#" target="_blank" aria-label="Open in new tab">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Open
        </a>
      </div>
    </header>
    <div class="preview-body">
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </div>
        <h2>Component Preview</h2>
        <p>Select a component from the sidebar to preview it here.</p>
      </div>
      <iframe id="preview-frame" title="Component Preview" style="display:none;"></iframe>
    </div>
  </main>
</div>

<script>
  const frame       = document.getElementById('preview-frame');
  const titleEl     = document.getElementById('preview-title');
  const breadcrumb  = document.getElementById('preview-breadcrumb');
  const openLink    = document.getElementById('open-link');
  const themeToggle = document.getElementById('theme-toggle');
  const welcome     = document.getElementById('welcome-screen');
  let currentTheme  = document.documentElement.dataset.theme || 'light';

  // Navigation
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');

      const src   = link.dataset.src;
      const label = link.dataset.label;
      const group = link.dataset.group;

      titleEl.textContent    = label;
      breadcrumb.textContent = group + ' / ' + label;
      openLink.href          = src;

      welcome.style.display = 'none';
      frame.style.display   = 'block';
      frame.src             = src + '?theme=' + currentTheme;
    });
  });

  // Theme toggle
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = currentTheme;
    try { localStorage.setItem('ds-theme', currentTheme); } catch(e) {}

    if (frame.style.display !== 'none' && frame.contentWindow) {
      try { frame.contentWindow.postMessage({ type: 'theme', value: currentTheme }, '*'); } catch(e) {}
    }
  });
</script>
</body>
</html>
