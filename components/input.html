<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input — Design System</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/framework.css">
  <script>(function(){try{var t=localStorage.getItem('ds-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}}());</script>
  <style>
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text);
    }
    .label .required { color: var(--color-error); margin-left: 2px; }
    .hint { font-size: var(--text-xs); color: var(--color-text-muted); }
    .hint.error  { color: var(--color-error); }
    .hint.success { color: var(--color-success); }

    /* Base input */
    .input {
      width: 100%;
      height: var(--size-md);
      padding: 0 var(--space-3);
      font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-lg);
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
    }
    .input::placeholder { color: var(--color-text-subtle); }
    .input:hover { border-color: var(--color-primary); }
    .input:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.15);
    }
    .input:disabled {
      background: var(--color-surface-overlay);
      color: var(--color-text-muted);
      cursor: not-allowed;
      border-color: var(--color-border);
    }
    .input.error {
      border-color: var(--color-error);
    }
    .input.error:focus {
      box-shadow: 0 0 0 3px rgb(239 68 68 / 0.15);
    }
    .input.success {
      border-color: var(--color-success);
    }
    .input.success:focus {
      box-shadow: 0 0 0 3px rgb(34 197 94 / 0.15);
    }

    /* Sizes */
    .input-sm { height: var(--size-sm); font-size: var(--text-xs); padding: 0 var(--space-2); border-radius: var(--radius-md); }
    .input-lg { height: var(--size-lg); font-size: var(--text-base); padding: 0 var(--space-4); border-radius: var(--radius-xl); }

    /* Input with affix */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-prefix, .input-suffix {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .input-prefix { left: var(--space-3); }
    .input-suffix { right: var(--space-3); }
    .input-prefix + .input { padding-left: var(--space-9); }
    .input:has(+ .input-suffix) { padding-right: var(--space-9); }
    .input-wrap .input { padding-right: var(--space-9); }
    .input-wrap .has-prefix { padding-left: var(--space-9); }

    /* Text addons */
    .input-group {
      display: flex;
    }
    .input-addon {
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      background: var(--color-surface-overlay);
      border: 1px solid var(--color-border-strong);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .input-addon-left {
      border-right: none;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }
    .input-addon-right {
      border-left: none;
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    }
    .input-group .input { border-radius: 0; flex: 1; }
    .input-group .input:focus { z-index: 1; }

    .fields-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">Input</h1>
    <p class="page-description">Text inputs with labels, hints, validation states, affixes, and size variants. Pure CSS styling.</p>
  </div>

  <section class="section">
    <h2 class="section-title">Basic</h2>
    <div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="field">
        <label class="label" for="name">Full name</label>
        <input class="input" id="name" type="text" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label class="label" for="email">Email address <span class="required">*</span></label>
        <input class="input" id="email" type="email" placeholder="jane@example.com">
        <span class="hint">We'll never share your email.</span>
      </div>
      <div class="field">
        <label class="label" for="pass">Password</label>
        <div class="input-wrap">
          <input class="input has-prefix" id="pass" type="password" placeholder="••••••••">
          <span class="input-prefix">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <button class="input-suffix" style="pointer-events:auto;background:none;border:none;cursor:pointer;color:var(--color-text-muted)" onclick="var i=this.previousElementSibling.previousElementSibling;i.type=i.type==='password'?'text':'password'" aria-label="Toggle password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Validation States</h2>
    <div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="field">
        <label class="label" for="ok">Username</label>
        <div class="input-wrap">
          <input class="input success" id="ok" type="text" value="janedoe">
          <span class="input-suffix" style="color:var(--color-success)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>
        <span class="hint success">Username is available.</span>
      </div>
      <div class="field">
        <label class="label" for="err">Email address</label>
        <div class="input-wrap">
          <input class="input error" id="err" type="email" value="notanemail">
          <span class="input-suffix" style="color:var(--color-error)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
        </div>
        <span class="hint error">Please enter a valid email address.</span>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">With Icon Prefix</h2>
    <div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="input-wrap">
        <input class="input has-prefix" type="search" placeholder="Search…">
        <span class="input-prefix">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
      </div>
      <div class="input-wrap">
        <input class="input has-prefix" type="url" placeholder="https://example.com">
        <span class="input-prefix">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </span>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Text Addons</h2>
    <div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="input-group">
        <span class="input-addon input-addon-left">https://</span>
        <input class="input" type="text" placeholder="yoursite.com">
        <span class="input-addon input-addon-right">.com</span>
      </div>
      <div class="input-group">
        <input class="input" type="number" placeholder="0.00">
        <span class="input-addon input-addon-right">USD</span>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Sizes</h2>
    <div style="max-width:440px;display:flex;flex-direction:column;gap:var(--space-3)">
      <input class="input input-sm" type="text" placeholder="Small input">
      <input class="input" type="text" placeholder="Default input">
      <input class="input input-lg" type="text" placeholder="Large input">
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Disabled</h2>
    <div style="max-width:440px">
      <input class="input" type="text" placeholder="Disabled input" disabled value="Cannot edit this">
    </div>
  </section>
</div>
<script>window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.documentElement.dataset.theme=e.data.value;});</script>
</body>
</html>
