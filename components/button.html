<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button — Design System</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/framework.css">
  <script>(function(){try{var t=localStorage.getItem('ds-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}}());</script>
  <style>
    /* Base button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0 var(--space-4);
      height: var(--size-md);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      border-radius: var(--radius-lg);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-colors), box-shadow 150ms ease, transform 100ms ease;
      user-select: none;
      text-decoration: none;
      font-family: inherit;
    }
    .btn:focus-visible {
      outline: 2px solid var(--color-border-focus);
      outline-offset: 2px;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled, .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Variants */
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-primary-fg);
      border-color: var(--color-primary);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
      box-shadow: 0 4px 12px rgb(99 102 241 / 0.3);
    }

    .btn-secondary {
      background: var(--color-secondary);
      color: var(--color-secondary-fg);
      border-color: var(--color-secondary);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--color-secondary-hover);
      border-color: var(--color-secondary-hover);
      box-shadow: 0 4px 12px rgb(168 85 247 / 0.3);
    }

    .btn-outline {
      background: transparent;
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }
    .btn-outline:hover:not(:disabled) {
      background: var(--color-surface-overlay);
      border-color: var(--color-border-strong);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-text-muted);
      border-color: transparent;
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--color-surface-overlay);
      color: var(--color-text);
    }

    .btn-danger {
      background: var(--color-error);
      color: #ffffff;
      border-color: var(--color-error);
    }
    .btn-danger:hover:not(:disabled) {
      background: var(--palette-red-600);
      border-color: var(--palette-red-600);
      box-shadow: 0 4px 12px rgb(239 68 68 / 0.3);
    }

    .btn-success {
      background: var(--color-success);
      color: #ffffff;
      border-color: var(--color-success);
    }
    .btn-success:hover:not(:disabled) {
      background: var(--palette-green-700);
      border-color: var(--palette-green-700);
    }

    /* Sizes */
    .btn-xs { height: var(--size-xs); padding: 0 var(--space-2); font-size: var(--text-xs); border-radius: var(--radius-md); }
    .btn-sm { height: var(--size-sm); padding: 0 var(--space-3); font-size: var(--text-sm); border-radius: var(--radius-md); }
    .btn-lg { height: var(--size-lg); padding: 0 var(--space-6); font-size: var(--text-base); border-radius: var(--radius-xl); }
    .btn-xl { height: var(--size-xl); padding: 0 var(--space-8); font-size: var(--text-lg); border-radius: var(--radius-xl); }

    .btn-full { width: 100%; }

    /* Icon button */
    .btn-icon {
      padding: 0;
      width: var(--size-md);
      height: var(--size-md);
      flex-shrink: 0;
    }
    .btn-icon.btn-sm { width: var(--size-sm); height: var(--size-sm); }
    .btn-icon.btn-lg { width: var(--size-lg); height: var(--size-lg); }

    /* Loading state */
    .btn-loading {
      position: relative;
      pointer-events: none;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Button group */
    .btn-group {
      display: inline-flex;
    }
    .btn-group .btn {
      border-radius: 0;
    }
    .btn-group .btn:first-child { border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
    .btn-group .btn:last-child  { border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
    .btn-group .btn:not(:last-child) { border-right-color: transparent; }
    .btn-group .btn:hover { z-index: 1; }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">Button</h1>
    <p class="page-description">Flexible button component with variants, sizes, states, and compositions. Pure CSS with no JavaScript required.</p>
  </div>

  <section class="section">
    <h2 class="section-title">Variants</h2>
    <div class="demo-row center">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-outline">Outline</button>
      <button class="btn btn-ghost">Ghost</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-success">Success</button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Sizes</h2>
    <div class="demo-row center">
      <button class="btn btn-primary btn-xs">Extra Small</button>
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-lg">Large</button>
      <button class="btn btn-primary btn-xl">Extra Large</button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">With Icons</h2>
    <div class="demo-row center">
      <button class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Item
      </button>
      <button class="btn btn-outline">
        Download
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Icon Buttons</h2>
    <div class="demo-row center">
      <button class="btn btn-primary btn-icon btn-sm" aria-label="Add">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="btn btn-outline btn-icon" aria-label="Edit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" aria-label="Delete">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon btn-lg" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">States</h2>
    <div class="demo-row center">
      <button class="btn btn-primary">Default</button>
      <button class="btn btn-primary btn-loading" disabled>
        <span class="spinner"></span>
        Loading…
      </button>
      <button class="btn btn-primary" disabled>Disabled</button>
      <button class="btn btn-outline" disabled>Disabled Outline</button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Button Group</h2>
    <div class="demo-row center">
      <div class="btn-group">
        <button class="btn btn-outline">Day</button>
        <button class="btn btn-primary">Week</button>
        <button class="btn btn-outline">Month</button>
        <button class="btn btn-outline">Year</button>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Full Width</h2>
    <div style="max-width:320px;display:flex;flex-direction:column;gap:var(--space-3)">
      <button class="btn btn-primary btn-full">Sign In</button>
      <button class="btn btn-outline btn-full">Create Account</button>
    </div>
  </section>
</div>
<script>window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.documentElement.dataset.theme=e.data.value;});</script>
</body>
</html>
