<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker — Design System</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/framework.css">
  <script>(function(){try{var t=localStorage.getItem('ds-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}}());</script>
  <style>
    /* ---- Field wrapper ---- */
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text);
    }
    .label .required { color: var(--color-error); margin-left: 2px; }
    .hint { font-size: var(--text-xs); color: var(--color-text-muted); }

    /* ---- Datepicker trigger input ---- */
    .dp-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 100%;
    }

    .dp-input {
      width: 100%;
      height: var(--size-md);
      padding: 0 var(--space-10) 0 var(--space-3);
      font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-lg);
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
      cursor: pointer;
      caret-color: transparent;
      font-family: inherit;
    }
    .dp-input::placeholder { color: var(--color-text-subtle); }
    .dp-input:hover { border-color: var(--color-primary); }
    .dp-input:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.15);
    }
    .dp-input:disabled {
      background: var(--color-surface-overlay);
      color: var(--color-text-muted);
      cursor: not-allowed;
      border-color: var(--color-border);
    }
    .dp-input.dp-open {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.15);
    }

    .dp-icon {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .dp-clear {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      display: none;
      align-items: center;
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .dp-clear:hover { color: var(--color-text); }
    .dp-wrap.has-value .dp-icon  { display: none; }
    .dp-wrap.has-value .dp-clear { display: flex; }

    /* Size variants */
    .dp-sm .dp-input { height: var(--size-sm); font-size: var(--text-xs); padding: 0 var(--space-8) 0 var(--space-2); border-radius: var(--radius-md); }
    .dp-lg .dp-input { height: var(--size-lg); font-size: var(--text-base); padding: 0 var(--space-10) 0 var(--space-4); border-radius: var(--radius-xl); }

    /* ---- Popup panel ---- */
    .dp-panel {
      position: absolute;
      top: calc(100% + var(--space-2));
      left: 0;
      width: 280px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-4);
      z-index: var(--z-dropdown);
      display: none;
      flex-direction: column;
      gap: var(--space-3);
      animation: dp-in var(--dur-150) var(--ease-out);
    }
    .dp-panel.open { display: flex; }

    @keyframes dp-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Panel header ---- */
    .dp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .dp-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 120ms, color 120ms;
      font-family: inherit;
    }
    .dp-nav-btn:hover {
      background: var(--color-surface-overlay);
      color: var(--color-text);
    }

    .dp-month-label {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-text);
      flex: 1;
      text-align: center;
    }

    /* ---- Day-of-week row ---- */
    .dp-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .dp-weekday {
      text-align: center;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--color-text-subtle);
      padding: var(--space-1) 0;
    }

    /* ---- Date grid ---- */
    .dp-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .dp-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      color: var(--color-text);
      border-radius: var(--radius-md);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      transition: background 100ms, color 100ms;
    }
    .dp-day:hover:not(:disabled) { background: var(--color-surface-overlay); }
    .dp-day.outside {
      color: var(--color-text-subtle);
    }
    .dp-day.today {
      font-weight: var(--font-bold);
      color: var(--color-primary);
      box-shadow: inset 0 0 0 1.5px var(--color-primary);
    }
    .dp-day.selected {
      background: var(--color-primary);
      color: var(--color-primary-fg);
      font-weight: var(--font-semibold);
    }
    .dp-day.selected.today { box-shadow: none; }
    .dp-day:disabled {
      color: var(--color-text-subtle);
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ---- Footer (Today shortcut) ---- */
    .dp-footer {
      border-top: 1px solid var(--color-border);
      padding-top: var(--space-3);
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .dp-footer-btn {
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: background 120ms, color 120ms;
    }
    .dp-footer-btn:hover { background: var(--color-surface-overlay); color: var(--color-text); }
    .dp-footer-btn.primary {
      background: var(--color-primary);
      color: var(--color-primary-fg);
      border-color: var(--color-primary);
    }
    .dp-footer-btn.primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }

    /* ---- Range picker ---- */
    .dp-day.range-start,
    .dp-day.range-end {
      background: var(--color-primary);
      color: var(--color-primary-fg);
      font-weight: var(--font-semibold);
    }
    .dp-day.in-range {
      background: var(--color-primary-subtle);
      color: var(--color-primary);
      border-radius: 0;
    }
    .dp-day.range-start { border-radius: var(--radius-md) 0 0 var(--radius-md); }
    .dp-day.range-end   { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .dp-day.range-start.range-end { border-radius: var(--radius-md); }

    /* ---- Demo spacing ---- */
    .dp-demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-6);
      align-items: flex-start;
    }
    .dp-demo-col {
      flex: 1;
      min-width: 220px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">Datepicker</h1>
    <p class="page-description">Date selection inputs with calendar popups, range selection, size variants, and disabled states. Fully keyboard-navigable.</p>
  </div>

  <!-- Basic -->
  <section class="section">

            <span class="dp-icon">

            </span>
            <button class="dp-clear" aria-label="Clear date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="dp-panel" id="dp-preselect-panel"></div>

        </div>
      </div>

  </section>

  <!-- Sizes -->
  <section class="section">
    <h2 class="section-title">Sizes</h2>
    <div style="max-width:320px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="dp-wrap dp-sm" id="dp-sm-wrap">
        <input class="dp-input" id="dp-sm" type="text" placeholder="MM / DD / YYYY" readonly>
        <span class="dp-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <button class="dp-clear" aria-label="Clear date">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="dp-panel" id="dp-sm-panel"></div>
      </div>

      <div class="dp-wrap" id="dp-md-wrap">
        <input class="dp-input" id="dp-md" type="text" placeholder="MM / DD / YYYY" readonly>
        <span class="dp-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <button class="dp-clear" aria-label="Clear date">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="dp-panel" id="dp-md-panel"></div>
      </div>

      <div class="dp-wrap dp-lg" id="dp-lg-wrap">
        <input class="dp-input" id="dp-lg" type="text" placeholder="MM / DD / YYYY" readonly>
        <span class="dp-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <button class="dp-clear" aria-label="Clear date">

  <!-- Range Picker -->
  <section class="section">
    <h2 class="section-title">Date Range</h2>

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

      <div class="dp-demo-col">

            <input class="dp-input" id="dp-range-end" type="text" placeholder="MM / DD / YYYY" readonly>
            <span class="dp-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <button class="dp-clear" aria-label="Clear date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <!-- Disabled / Readonly -->
  <section class="section">
    <h2 class="section-title">Disabled</h2>
    <div style="max-width:320px;display:flex;flex-direction:column;gap:var(--space-4)">
      <div class="field">
        <label class="label" for="dp-disabled">Disabled</label>
        <div class="dp-wrap">
          <input class="dp-input" id="dp-disabled" type="text" value="06 / 15 / 2025" readonly disabled>
          <span class="dp-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>

    </div>
  </section>

</div>

<script>
  // ---- Utilities ----
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDate(d) { return pad(d.getMonth()+1) + ' / ' + pad(d.getDate()) + ' / ' + d.getFullYear(); }
  function sameDay(a, b) { return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function isToday(d) { return sameDay(d, new Date()); }
  function dateKey(d) { return d.getFullYear()*10000 + d.getMonth()*100 + d.getDate(); }

  // ---- Datepicker class ----
  class Datepicker {
    constructor(wrapId, panelId, opts = {}) {
      this.wrap    = document.getElementById(wrapId);
      this.panel   = document.getElementById(panelId);
      this.input   = this.wrap.querySelector('.dp-input');
      this.clearBtn = this.wrap.querySelector('.dp-clear');
      this.opts    = opts;           // { rangeGroup, rangeRole, minDate, maxDate, preselect }
      this.selected = opts.preselect ? new Date(opts.preselect) : null;
      this.view    = new Date();
      this.view.setDate(1);
      this.open    = false;
      this._init();
    }

    _init() {
      if (this.selected) {
        this.input.value = formatDate(this.selected);
        this.wrap.classList.add('has-value');
        this.view = new Date(this.selected.getFullYear(), this.selected.getMonth(), 1);
      }

      this.input.addEventListener('click', (e) => { e.stopPropagation(); this.toggle(); });
      this.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggle(); }
        if (e.key === 'Escape') this.close();
      });

      if (this.clearBtn) {
        this.clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.selected = null;
          this.input.value = '';
          this.wrap.classList.remove('has-value');
          this.input.classList.remove('dp-open');
          if (this.opts.onClear) this.opts.onClear();
          this.close();
        });
      }

      document.addEventListener('click', (e) => {
        if (!this.wrap.contains(e.target)) this.close();
      });

      this.render();
    }

    toggle() { this.open ? this.close() : this.openPanel(); }

    openPanel() {
      this.open = true;
      this.panel.classList.add('open');
      this.input.classList.add('dp-open');
    }

    close() {
      this.open = false;
      this.panel.classList.remove('open');
      this.input.classList.remove('dp-open');
    }

    select(date) {
      this.selected = date;
      this.input.value = formatDate(date);
      this.wrap.classList.add('has-value');
      if (this.opts.onSelect) this.opts.onSelect(date);
      this.render();
      if (!this.opts.keepOpen) this.close();
    }

    navMonth(delta) {
      this.view.setMonth(this.view.getMonth() + delta);
      this.render();
    }

    render() {
      const y = this.view.getFullYear();
      const m = this.view.getMonth();
      const today = new Date();

      // Header
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m+1, 0).getDate();
      const daysInPrev  = new Date(y, m, 0).getDate();

      let html = `
        <div class="dp-header">
          <button class="dp-nav-btn" data-nav="-1" aria-label="Previous month">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="dp-month-label">${MONTHS[m]} ${y}</span>
          <button class="dp-nav-btn" data-nav="1" aria-label="Next month">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="dp-weekdays">${WEEKDAYS.map(d => `<div class="dp-weekday">${d}</div>`).join('')}</div>
        <div class="dp-days">`;

      // Previous month overflow
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = new Date(y, m-1, daysInPrev - i);
        html += this._dayBtn(d, true);
      }
      // Current month
      for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(y, m, i);
        html += this._dayBtn(d, false);
      }
      // Next month overflow
      const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
      let next = 1;
      for (let i = firstDay + daysInMonth; i < totalCells; i++, next++) {
        const d = new Date(y, m+1, next);
        html += this._dayBtn(d, true);
      }

      html += `</div>
        <div class="dp-footer">
          <button class="dp-footer-btn" data-today>Today</button>
          ${this.selected ? `<button class="dp-footer-btn" data-clear>Clear</button>` : ''}
        </div>`;

      this.panel.innerHTML = html;

      // Events
      this.panel.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); this.navMonth(+btn.dataset.nav); });
      });
      this.panel.querySelectorAll('.dp-day:not(:disabled)').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const d = new Date(+btn.dataset.ts);
          this.select(d);
        });
      });
      this.panel.querySelector('[data-today]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        const t = new Date(); t.setHours(0,0,0,0);
        this.view = new Date(t.getFullYear(), t.getMonth(), 1);
        this.select(t);
      });
      this.panel.querySelector('[data-clear]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        this.selected = null;
        this.input.value = '';
        this.wrap.classList.remove('has-value');
        if (this.opts.onClear) this.opts.onClear();
        this.render();
      });
    }

    _dayBtn(d, outside) {
      d.setHours(0,0,0,0);
      const classes = ['dp-day'];
      if (outside) classes.push('outside');
      if (isToday(d)) classes.push('today');
      if (sameDay(d, this.selected)) classes.push('selected');

      // Range highlighting
      if (this.opts.rangeGroup) {
        const g = this.opts.rangeGroup;
        const start = g.start?.selected;
        const end   = g.end?.selected;
        if (start && end) {
          const k = dateKey(d);
          if (sameDay(d, start)) classes.push('range-start');
          if (sameDay(d, end))   classes.push('range-end');
          if (k > dateKey(start) && k < dateKey(end)) classes.push('in-range');
        } else if (start && sameDay(d, start)) {
          classes.push('range-start', 'range-end');
        }
      }

      let disabled = '';
      if (this.opts.minDate && dateKey(d) < dateKey(this.opts.minDate)) disabled = 'disabled';
      if (this.opts.maxDate && dateKey(d) > dateKey(this.opts.maxDate)) disabled = 'disabled';

      return `<button class="${classes.join(' ')}" data-ts="${d.getTime()}" ${disabled} aria-label="${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}">${d.getDate()}</button>`;
    }
  }

  // ---- Instantiate pickers ----
  const today = new Date(); today.setHours(0,0,0,0);

  new Datepicker('dp-basic-wrap', 'dp-basic-panel');
  new Datepicker('dp-preselect-wrap', 'dp-preselect-panel', { preselect: today });
  new Datepicker('dp-sm-wrap', 'dp-sm-panel');
  new Datepicker('dp-md-wrap', 'dp-md-panel');
  new Datepicker('dp-lg-wrap', 'dp-lg-panel');

  // Range pair — each picker re-renders the other after selection
  const rangeGroup = {};
  const dpRangeStart = new Datepicker('dp-range-start-wrap', 'dp-range-start-panel', {
    rangeGroup,
    keepOpen: false,
    onSelect(d) { rangeGroup.end?.render(); },
    onClear()   { rangeGroup.end?.render(); }
  });
  const dpRangeEnd = new Datepicker('dp-range-end-wrap', 'dp-range-end-panel', {
    rangeGroup,
    keepOpen: false,
    minDate: null,
    onSelect(d) { rangeGroup.start?.render(); },
    onClear()   { rangeGroup.start?.render(); }
  });
  rangeGroup.start = dpRangeStart;
  rangeGroup.end   = dpRangeEnd;

  // Keep end minDate in sync with start selection
  dpRangeStart.opts.onSelect = function(d) {
    dpRangeEnd.opts.minDate = d;
    if (dpRangeEnd.selected && dateKey(dpRangeEnd.selected) < dateKey(d)) {
      dpRangeEnd.selected = null;
      dpRangeEnd.input.value = '';
      dpRangeEnd.wrap.classList.remove('has-value');
    }
    rangeGroup.end?.render();
  };

  // ---- Theme bridge ----
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'theme') document.documentElement.dataset.theme = e.data.value;
  });
</script>
</body>
</html>
